name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG (EXYNOS990 = Galaxy S20 family, A5XELTE = donor)
        default: EXYNOS990
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, codex/a5xelte-bringup, s8-dreamlte]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

# No concurrency group: with one runner it only served to cancel the very run
# that was about to start.

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'EXYNOS990' }}

jobs:
  build:
    permissions:
      contents: write
    # macos-14 is the only image left that ships Xcode 15, whose iig matches
    # xnu-8796 (macos-13 was retired in Dec 2025; macos-15 and 15-intel ship
    # Xcode 16+, whose iig emits IORPC.kernelContent).  That pins this job to
    # the arm64 pool, which GitHub sometimes queues for several minutes.
    #
    # Same shape as the ios-sweet workflow:
    # macos-14, the same blacktop/darwin-xnu-build revision, the same steps.
    # macos-13 is gone from GitHub's hosted pool, so a job asking for it
    # never gets a runner.
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          if [ "$MACHINE_CONFIG" = A5XELTE ] || [ "$MACHINE_CONFIG" = EXYNOS990 ]; then
            # Cortex-A53 (Exynos7580 / Exynos8895) and the Exynos 990 boot
            # cluster are ARMv8.0-compatible: Xcode's default arm64 code
            # generation emits LSE atomics (ldadd/cas) that trap as
            # "Undefined kernel instruction" right after "Firehose configured"
            # (S8 boot 2). Same flags as tools/a5xelte-build-firehose.sh.
            sed -i '' "s/ARCHS=\"x86_64 arm64e\" VALID_ARCHS=\"x86_64 arm64e\"/ARCHS=arm64 VALID_ARCHS=arm64 OTHER_CFLAGS='-mkernel -Wno-packed -mcpu=cortex-a53 -march=armv8-a+crypto'/" dxb/build.sh
          else
            sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          fi
          grep -c 'VALID_ARCHS=arm64' dxb/build.sh || true
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          # The run log needs a token to download, so on failure publish what
          # went wrong where it is readable without one: annotations.
          #  - the lines that look like compile/tool errors;
          #  - the tail of the log, which is the only place an early failure
          #    (no "error:" line at all) shows up.
          # The step runs under `bash -e`, so relax it around the build.
          set +e
          bash build.sh 2>&1 | tee /tmp/xnu-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            strip() { perl -pe 's/\e\[[0-9;]*m//g'; }
            # GitHub keeps only the first 10 annotations of a step, so the tail
            # goes first: the end of the log is where the failure is.
            tail -n 10 /tmp/xnu-build.log | strip \
              | while IFS= read -r line; do echo "::error::$line"; done
            {
              echo '### Build failed (rc='$rc')'
              echo '```'
              tail -n 200 /tmp/xnu-build.log | strip
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Publish the build log
        if: failure()
        run: |
          # Run logs need a login, so on failure the log is committed to a
          # branch: that branch can be fetched with git, which is what the
          # agent that fixes the build has access to.
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          tail -n 1000 /tmp/xnu-build.log | perl -pe 's/\e\[[0-9;]*m//g' > ci-log.txt
          git checkout -q -B ci-logs
          git add -f ci-log.txt
          git commit -q -m "build log for ${GITHUB_SHA}" || true
          git push -q -f origin ci-logs

      - name: Collect the kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
